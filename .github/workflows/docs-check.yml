name: Docs check

on:
  push:
    paths:
      - 'docs/**'
      - 'products/website/apps/researchlab/**'
      - 'products/website/build/apps/researchlab/**'
      - 'tools/check-docs.py'
      - 'tools/generate-docs-index.py'
      - 'tools/check-build-sync.py'
      - 'tools/generate-sitemap.py'
      - 'products/website/index.html'
      - 'products/website/apps/researchlab/index.html'
      - 'products/website/src/pages/**'
      - 'products/website/sitemap.xml'
      - 'products/website/build/sitemap.xml'
  pull_request:
    paths:
      - 'docs/**'
      - 'products/website/apps/researchlab/**'
      - 'products/website/build/apps/researchlab/**'
      - 'tools/check-docs.py'
      - 'tools/generate-docs-index.py'
      - 'tools/check-build-sync.py'
      - 'tools/generate-sitemap.py'
      - 'products/website/index.html'
      - 'products/website/apps/researchlab/index.html'
      - 'products/website/src/pages/**'
      - 'products/website/sitemap.xml'
      - 'products/website/build/sitemap.xml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check build parity
        run: python tools/check-build-sync.py

      - name: Check docs integrity
        run: python tools/check-docs.py check

      - name: Check navigation freshness (regeneration must not change anything)
        run: |
          python tools/generate-docs-index.py > /dev/null
          git diff --exit-code -- docs/ || {
            echo '::error::docs/ расходится с генератором tools/generate-docs-index.py — запусти его локально и закоммить результат';
            exit 1;
          }

      - name: Check sitemap freshness (routes → sitemap must match)
        run: |
          python tools/generate-sitemap.py --check || {
            echo '::error::sitemap.xml расходится с маршрутами src/pages — запусти python tools/generate-sitemap.py и закоммить';
            exit 1;
          }
