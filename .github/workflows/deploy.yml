name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install markdown rich

      - name: Check sitemap freshness
        # Публикуемый sitemap обязан совпадать с src/pages + лабораторией:
        # расхождение блокирует публикацию, а не уезжает в прод.
        run: python tools/generate-sitemap.py --check

      - name: Build website
        working-directory: products/website
        run: |
          bash tools/build.sh

      # build.sh ставит зависимости прямо в build/ (npm install), поэтому артефакт
      # надо очистить: node_modules уже публиковался на Pages (проверено 2026-09-29
      # запросом /node_modules/tailwindcss/package.json → 200).
      - name: Prune build-only files from artifact
        working-directory: products/website
        run: rm -rf build/node_modules build/package.json build/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: products/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4