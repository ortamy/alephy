name: i18n check

on:
  push:
    paths:
      - 'products/website/src/locales/**'
      - 'products/website/src/js/**'
      - 'products/website/src/pages/**'
      - 'tools/i18n-check.py'
      - 'tools/i18n-extract.py'
      - 'tools/i18n-verify.mjs'
      - '.github/workflows/i18n-check.yml'
  pull_request:
    paths:
      - 'products/website/src/locales/**'
      - 'products/website/src/js/**'
      - 'products/website/src/pages/**'
      - 'tools/i18n-check.py'
      - 'tools/i18n-extract.py'
      - 'tools/i18n-verify.mjs'
      - '.github/workflows/i18n-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Словари, манифест, паритет и использование ключей
        run: python tools/i18n-check.py check

      - name: Извлечение ключей совпадает со словарём разметки
        run: python tools/i18n-extract.py check

      - name: Рантайм локализации (7 сценариев)
        run: node tools/i18n-verify.mjs
