<section class="methodology-shell" aria-labelledby="methodology-title">
  <header class="methodology-heading">
    <div>
      <p class="methodology-kicker" id="methodology-hero-kicker">АЛЕФИ · ПРИНЦИПЫ РАЗОБЛАЧЕНИЯ</p>
      <h1 id="methodology-title">Методология</h1>
      <p class="subtitle methodology-hero-description" id="methodology-hero-description">Базовые правила, по которым выявляется подмена смысла и возвращается физика текста.</p>
    </div>
  </header>

  <div class="methodology-toolbar methodology-navigation lab-card">
    <select id="methodology-category-select" class="lab-input lab-toolbar-select" aria-label="Раздел методологии">
      <option value="principles">Принципы разоблачения</option>
      <option value="methods">Методы разоблачения</option>
      <option value="mechanisms">Механизмы подмены</option>
      <option value="shifts">Языковые сдвиги</option>
      <option value="techniques">Приёмы подмены</option>
      <option value="philosophemes">Греческие философемы</option>
      <option value="distortions">Типы искажений</option>
      <option value="matrices">Культурные матрицы</option>
      <option value="paleo-translation">Принципы палео-перевода</option>
    </select>
    <button type="button" class="lab-btn lab-btn-primary lab-btn-sm" id="methodology-add-btn">Добавить карточку</button>
  </div>

  <div class="methodology-panel" id="methodology-panel" role="tabpanel" aria-live="polite">
    <div class="lab-spinner show"><div class="loader"></div><div class="spinner-text">Загрузка материалов…</div></div>
  </div>
