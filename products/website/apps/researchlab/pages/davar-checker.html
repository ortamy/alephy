<section class="davar-checker-shell" aria-labelledby="davar-checker-title">
  <div class="davar-checker-intro">
    <p class="davar-checker-kicker" data-davar-i18n="word">СЛОВО</p>
    <h1 id="davar-checker-title" class="sr-only">Чекер воплощения</h1>
  </div>

  <form id="davar-checker-form" class="davar-checker-panel" novalidate>
    <div class="davar-checker-panel-head"><span class="davar-checker-rule" aria-hidden="true"></span></div>
    <div class="davar-checker-form-row">
      <input id="davar-checker-input" class="lab-input" type="text" autocomplete="off" placeholder="Слово из набора" aria-describedby="davar-checker-hint">
      <button class="lab-btn lab-btn-primary" type="submit" data-davar-i18n="check">Проверить</button>
      <span id="davar-checker-hint" class="davar-checker-hint">Ctrl+Enter</span>
    </div>
    <div class="davar-checker-examples" aria-label="Примеры">
      <span data-davar-i18n="examples">Примеры</span>
      <button type="button" data-davar-example="вода">вода</button>
      <button type="button" data-davar-example="дух">дух</button>
      <button type="button" data-davar-example="закон">закон</button>
      <button type="button" data-davar-example="любовь">любовь</button>
    </div>
  </form>

  <div id="davar-checker-result" class="davar-checker-result" role="status" aria-live="polite">
    <div class="davar-checker-empty"><i data-lucide="scan-search" aria-hidden="true"></i><span data-davar-i18n="empty">Введите слово из проверяемого набора</span></div>
  </div>
</section>
