<section class="davar-checker-shell" aria-labelledby="davar-checker-title">
  <div class="davar-checker-intro"><p class="davar-checker-kicker">СЛОВО</p><h1 id="davar-checker-title" class="sr-only">Чекер воплощения</h1></div>
  <form id="davar-checker-form" class="davar-checker-panel" novalidate>
    <div class="davar-checker-panel-head"><span class="davar-checker-rule" aria-hidden="true"></span></div>
    <div class="davar-checker-form-row"><input id="davar-checker-input" class="lab-input" type="text" autocomplete="off" placeholder="Слово из набора"><button class="lab-btn lab-btn-primary" type="submit">Проверить</button><span id="davar-checker-hint" class="davar-checker-hint">Ctrl+Enter</span></div>
    <div class="davar-checker-examples" aria-label="Примеры"><span>Примеры</span><button type="button" data-davar-example="вода">вода</button><button type="button" data-davar-example="дух">дух</button><button type="button" data-davar-example="закон">закон</button><button type="button" data-davar-example="любовь">любовь</button><button type="button" data-davar-example="завет">завет</button></div>
  </form>
  <div id="davar-checker-result" class="davar-checker-result" role="status" aria-live="polite"></div>
</section>
