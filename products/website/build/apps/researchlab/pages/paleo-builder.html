<section class="paleo-builder-shell" aria-labelledby="paleo-builder-title">
  <header class="section-hero">
    <div class="section-hero-watermark" aria-hidden="true">𐤀 𐤁 𐤂 𐤃 𐤄 𐤅</div>
    <div class="section-hero-kicker">АЛЕФИ · ПАЛЕО-КОНСТРУКТОР</div>
    <h1 id="paleo-builder-title">Палео-конструктор</h1>
    <p class="section-hero-lead">Соберите слово как последовательность образов и действий.</p>
  </header>

  <div class="paleo-builder-layout">
    <section class="letter-palette" aria-labelledby="letter-palette-title">
      <header class="zone-heading">
        <h2 id="letter-palette-title">Палео-буквы</h2>
        <span class="zone-count">22</span>
      </header>
      <p class="zone-note">Нажмите на знак или перетащите его в поле сборки.</p>
      <div class="palette-grid" data-paleo-palette></div>
    </section>

    <section class="assembly-panel" data-paleo-workspace aria-labelledby="assembly-title">
      <header class="zone-heading">
        <h2 id="assembly-title">Сборка</h2>
        <span class="workspace-count" data-workspace-count aria-label="знаков в слове">0</span>
      </header>

      <div class="workspace-drop" data-drop-zone tabindex="0" role="list" aria-label="Собираемое слово">
        <div class="workspace-empty" data-workspace-empty>
          <span class="drop-glyph" aria-hidden="true">𐤕</span>
          <strong>Поле ждёт первый знак</strong>
          <span>Нажмите букву в палитре или перетащите её сюда.</span>
        </div>
        <div class="workspace-letters" data-workspace-letters></div>
      </div>
      <p class="drop-status" data-drop-status aria-live="polite">Готово к сборке.</p>

      <p class="assembly-summary" data-assembly-summary aria-live="polite">Поле пусто</p>

      <div class="assembly-actions">
        <button type="button" class="lab-btn lab-btn-primary" data-action="check">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V7"/><path d="m16 12 2 2 4-4"/><path d="M22 6V4a1 1 0 0 0-1-1h-5a4 4 0 0 0-4 4 4 4 0 0 0-4-4H3a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6a1 1 0 0 0 1-1v-1.3"/></svg>
          <span>Проверить в словаре</span>
        </button>
        <button type="button" class="lab-btn lab-btn-secondary assembly-clear" data-action="clear" aria-label="Очистить сборку" title="Очистить сборку">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>
      </div>

      <div class="dictionary-result" data-dictionary-result aria-live="polite"></div>
    </section>
  </div>
</section>
