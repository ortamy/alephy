<section class="language-map-shell" aria-labelledby="language-map-title">
  <header class="language-map-head">
    <p class="language-map-kicker">ЖИВЫЕ ЯЗЫКИ / ДИАГНОСТИКА ПОТОКА</p>
    <h1 id="language-map-title">Карта языков</h1>
    <p class="subtitle">Сравнение современных языков по способности собирать Давар и выводить речь из одного состояния в другое.</p>
  </header>

  <div class="language-map-toolbar" role="search">
    <input type="search" id="language-map-query" class="lab-input language-map-search" placeholder="Название или тип языка…" aria-label="Поиск языков" autocomplete="off">
    <select id="language-map-type" class="lab-select language-map-select" aria-label="Тип языка">
      <option value="all">Все типы</option>
    </select>
    <select id="language-map-davar" class="lab-select language-map-select" aria-label="Уровень Давара">
      <option value="all">Любой уровень</option>
      <option value="низкая">Низкая</option>
      <option value="средняя">Средняя</option>
      <option value="высокая">Высокая</option>
    </select>
    <select id="language-map-sort" class="lab-select language-map-select language-map-select--sort" aria-label="Сортировка">
      <option value="asc">А → Я</option>
      <option value="desc">Я → А</option>
    </select>
    <div class="language-map-view" role="group" aria-label="Вид карты">
      <button type="button" class="language-map-view-btn" data-view="grid" aria-label="Карточки" title="Карточки"><i data-lucide="layout-grid" aria-hidden="true"></i></button>
      <button type="button" class="language-map-view-btn" data-view="list" aria-label="Список" title="Список"><i data-lucide="list" aria-hidden="true"></i></button>
    </div>
    <p class="language-map-count" id="language-map-count" role="status" aria-live="polite"></p>
  </div>

  <div class="language-map-results" id="language-map-results" aria-live="polite"></div>
</section>
